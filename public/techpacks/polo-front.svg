<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />

  <!-- Garment Outline -->
  <g id="polo-front-outline" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff" filter="url(#shadow)">
    <path d="
      M 250,110 
      L 140,165 
      L 70,285 
      L 130,315 
      L 170,245 
      L 175,590 
      L 425,590 
      L 430,245 
      L 470,315 
      L 530,285 
      L 460,165 
      L 350,110 
      Q 300,125 250,110 
      Z
    " />
  </g>

  <!-- Polo Collar Wings -->
  <!-- Left Collar Leaf -->
  <path d="M 250,110 L 220,185 L 285,165 L 285,130 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" />
  <!-- Right Collar Leaf -->
  <path d="M 350,110 L 380,185 L 315,165 L 315,130 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" />
  <!-- Collar Stand Curve -->
  <path d="M 250,110 Q 300,90 350,110" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Center Placket Box -->
  <rect x="285" y="130" width="30" height="130" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8" />
  <line x1="285" y1="260" x2="315" y2="260" stroke="#1e293b" stroke-width="2" />
  <!-- Placket Box Cross Stitch at bottom -->
  <line x1="285" y1="235" x2="315" y2="260" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2" />
  <line x1="285" y1="260" x2="315" y2="235" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- 2 Buttons -->
  <circle cx="300" cy="165" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="300" cy="205" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />

  <!-- Shoulder Seams -->
  <line x1="250" y1="110" x2="140" y2="165" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="350" y1="110" x2="460" y2="165" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Sleeve Armholes -->
  <path d="M 140,165 Q 165,205 170,245" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 460,165 Q 435,205 430,245" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Ribbed Sleeve Cuffs -->
  <polygon points="70,285 130,315 125,335 65,305" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />
  <polygon points="530,285 470,315 475,335 535,305" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5" />

  <!-- Bottom Hem & Side Vents -->
  <line x1="175" y1="580" x2="425" y2="580" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="175" y1="565" x2="175" y2="590" stroke="#ef4444" stroke-width="2" />
  <line x1="425" y1="565" x2="425" y2="590" stroke="#ef4444" stroke-width="2" />

  <!-- Subtitle -->
  <text x="300" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">
    TECH PACK - PIQUE POLO SHIRT (FRONT VIEW)
  </text>
  <text x="300" y="680" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Touch / Click anywhere to pinpoint defect coordinate
  </text>
</svg>
