<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc" rx="12" />

  <!-- Garment Base Body -->
  <g id="tshirt-front-outline" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff" filter="url(#shadow)">
    <!-- Main Outline: Collar Left -> Shoulder Left -> Left Armpit -> Left Sleeve Hem -> Inner Armpit -> Left Body -> Bottom Hem -> Right Body -> Right Armpit -> Right Sleeve Hem -> Right Shoulder -> Collar Right -> Front Collar Dip -->
    <path d="
      M 250,95 
      L 140,150 
      L 70,270 
      L 125,305 
      L 170,230 
      L 175,590 
      L 425,590 
      L 430,230 
      L 475,305 
      L 530,270 
      L 460,150 
      L 350,95 
      Q 300,165 250,95 
      Z
    " />
  </g>

  <!-- Ribbed Crew Collar -->
  <path d="M 250,95 Q 300,165 350,95 Q 300,135 250,95 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2" />
  <!-- Collar Inner Back Curve -->
  <path d="M 250,95 Q 300,75 350,95" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3,2" />
  <!-- Collar Stitch Line -->
  <path d="M 246,102 Q 300,175 354,102" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Shoulder Seams -->
  <line x1="250" y1="95" x2="140" y2="150" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="350" y1="95" x2="460" y2="150" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Sleeve Armhole Seams -->
  <path d="M 140,150 Q 165,190 170,230" fill="none" stroke="#1e293b" stroke-width="2" />
  <path d="M 460,150 Q 435,190 430,230" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Left Sleeve Hem Stitching -->
  <line x1="78" y1="265" x2="133" y2="300" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="82" y1="260" x2="137" y2="295" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Right Sleeve Hem Stitching -->
  <line x1="522" y1="265" x2="467" y2="300" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="518" y1="260" x2="463" y2="295" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Bottom Hem Stitching Lines (Double Needle) -->
  <line x1="175" y1="575" x2="425" y2="575" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="175" y1="581" x2="425" y2="581" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Subtitle / Watermark -->
  <text x="300" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">
    TECH PACK - CREW NECK T-SHIRT (FRONT VIEW)
  </text>
  <text x="300" y="680" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    Touch / Click anywhere to pinpoint defect coordinate
  </text>
</svg>
